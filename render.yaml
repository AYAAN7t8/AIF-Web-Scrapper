services:
  - type: web
    name: aif-web-scrapper
    runtime: node
    plan: free
    buildCommand: npm install --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: RATE_LIMIT_PER_MIN
        value: 120
