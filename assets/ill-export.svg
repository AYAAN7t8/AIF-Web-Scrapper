<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Switzer, 'Segoe UI', Inter, Arial, sans-serif">
  <title>Rows from a page leave as a CSV, Excel or Google Sheets file</title>
  <rect width="900" height="600" fill="#0b0b0b"/>
  <!-- rows on the left -->
  <g>
    <rect x="48" y="126" width="300" height="52" rx="12" fill="#1a1a1a"/><rect x="68" y="146" width="110" height="12" rx="6" fill="#e6e6e6"/><rect x="270" y="146" width="58" height="12" rx="6" fill="#32BFDA"/>
    <rect x="48" y="194" width="300" height="52" rx="12" fill="#1a1a1a"/><rect x="68" y="214" width="140" height="12" rx="6" fill="#e6e6e6"/><rect x="270" y="214" width="58" height="12" rx="6" fill="#32BFDA"/>
    <rect x="48" y="262" width="300" height="52" rx="12" fill="#1a1a1a"/><rect x="68" y="282" width="96" height="12" rx="6" fill="#e6e6e6"/><rect x="270" y="282" width="58" height="12" rx="6" fill="#32BFDA"/>
    <rect x="48" y="330" width="300" height="52" rx="12" fill="#1a1a1a"/><rect x="68" y="350" width="124" height="12" rx="6" fill="#e6e6e6"/><rect x="270" y="350" width="58" height="12" rx="6" fill="#32BFDA"/>
    <rect x="48" y="398" width="300" height="52" rx="12" fill="#1a1a1a"/><rect x="68" y="418" width="108" height="12" rx="6" fill="#e6e6e6"/><rect x="270" y="418" width="58" height="12" rx="6" fill="#32BFDA"/>
  </g>
  <text x="48" y="96" font-size="22" font-weight="600" fill="#f2f2f2">5 rows, 2 columns</text>
  <!-- flow lines -->
  <g fill="none" stroke-width="3" stroke-linecap="round">
    <path d="M360 288C450 288 450 168 540 168" stroke="#FF5E57"/>
    <path d="M360 288H540" stroke="#FCC55F"/>
    <path d="M360 288C450 288 450 408 540 408" stroke="#32BFDA"/>
  </g>
  <circle cx="360" cy="288" r="8" fill="#f2f2f2"/>
  <!-- three files -->
  <g>
    <path d="M552 120h200l40 40v56H552z" fill="#FF5E57"/><path d="M752 120v40h40" fill="#d84a44"/>
    <text x="576" y="186" font-size="34" font-weight="600" fill="#0a0a0a" letter-spacing="-1">CSV</text>
    <text x="690" y="184" font-size="15" fill="#3a0f0d">UTF-8</text>
  </g>
  <g>
    <path d="M552 240h200l40 40v56H552z" fill="#FCC55F"/><path d="M752 240v40h40" fill="#d8a94f"/>
    <text x="576" y="306" font-size="34" font-weight="600" fill="#0a0a0a" letter-spacing="-1">Excel</text>
    <text x="690" y="304" font-size="15" fill="#3d2d0b">.xlsx</text>
  </g>
  <g>
    <path d="M552 360h200l40 40v56H552z" fill="#32BFDA"/><path d="M752 360v40h40" fill="#2aa2b9"/>
    <text x="576" y="426" font-size="34" font-weight="600" fill="#0a0a0a" letter-spacing="-1">Sheets</text>
    <text x="712" y="424" font-size="15" fill="#06323b">online</text>
  </g>
  <text x="48" y="530" font-size="18" fill="#8a8a8a">Formulas are neutralised, so a cell can never run code.</text>
</svg>
