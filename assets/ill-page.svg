<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" font-family="Switzer, 'Segoe UI', Inter, Arial, sans-serif">
  <title>What goes in: a busy web page with the data buried among menus, ads and pop-ups</title>
  <rect width="800" height="1000" fill="#0b0b0b"/>
  <text x="56" y="84" font-size="26" font-weight="600" fill="#f2f2f2">What goes in</text>
  <text x="56" y="116" font-size="17" fill="#8a8a8a">A page built for people, not for spreadsheets</text>
  <rect x="56" y="150" width="688" height="796" rx="22" fill="#151515" stroke="#262626" stroke-width="2"/>
  <!-- nav -->
  <rect x="84" y="178" width="96" height="22" rx="11" fill="#2a2a2a"/>
  <rect x="420" y="184" width="64" height="10" rx="5" fill="#2a2a2a"/><rect x="500" y="184" width="64" height="10" rx="5" fill="#2a2a2a"/><rect x="580" y="184" width="64" height="10" rx="5" fill="#2a2a2a"/>
  <rect x="660" y="176" width="56" height="26" rx="13" fill="#2a2a2a"/>
  <!-- banner ad -->
  <rect x="84" y="226" width="632" height="96" rx="12" fill="#1d1d1d" stroke="#333" stroke-dasharray="6 6" stroke-width="2"/>
  <text x="400" y="282" font-size="18" fill="#5c5c5c" text-anchor="middle">ADVERTISEMENT</text>
  <!-- the data: product cards -->
  <g>
    <rect x="84" y="346" width="196" height="236" rx="14" fill="#1c1c1c" stroke="#32BFDA" stroke-width="2"/>
    <rect x="100" y="362" width="164" height="110" rx="8" fill="#78D3E6" opacity=".35"/>
    <text x="100" y="502" font-size="16" fill="#f2f2f2">Desk lamp</text><text x="100" y="530" font-size="17" font-weight="600" fill="#78D3E6">$39.00</text>
    <rect x="100" y="548" width="90" height="10" rx="5" fill="#2e2e2e"/>
    <rect x="302" y="346" width="196" height="236" rx="14" fill="#1c1c1c" stroke="#32BFDA" stroke-width="2"/>
    <rect x="318" y="362" width="164" height="110" rx="8" fill="#FCC55F" opacity=".35"/>
    <text x="318" y="502" font-size="16" fill="#f2f2f2">Monitor riser</text><text x="318" y="530" font-size="17" font-weight="600" fill="#78D3E6">$54.50</text>
    <rect x="318" y="548" width="90" height="10" rx="5" fill="#2e2e2e"/>
    <rect x="520" y="346" width="196" height="236" rx="14" fill="#1c1c1c" stroke="#32BFDA" stroke-width="2"/>
    <rect x="536" y="362" width="164" height="110" rx="8" fill="#FF5E57" opacity=".35"/>
    <text x="536" y="502" font-size="16" fill="#f2f2f2">Cable tray</text><text x="536" y="530" font-size="17" font-weight="600" fill="#78D3E6">$18.90</text>
    <rect x="536" y="548" width="90" height="10" rx="5" fill="#2e2e2e"/>
  </g>
  <!-- newsletter pop-up over the page -->
  <rect x="236" y="520" width="360" height="190" rx="16" fill="#000" opacity=".5" transform="translate(6 10)"/>
  <rect x="236" y="520" width="360" height="190" rx="16" fill="#262626" stroke="#3a3a3a" stroke-width="2"/>
  <text x="262" y="566" font-size="19" font-weight="600" fill="#d6d6d6">Get 10% off!</text>
  <rect x="262" y="590" width="240" height="12" rx="6" fill="#3a3a3a"/><rect x="262" y="614" width="190" height="12" rx="6" fill="#3a3a3a"/>
  <rect x="262" y="646" width="160" height="38" rx="19" fill="#3a3a3a"/>
  <path d="M566 542l14 14m0-14-14 14" stroke="#8a8a8a" stroke-width="2.4" stroke-linecap="round"/>
  <!-- more cards, partly hidden -->
  <rect x="84" y="606" width="196" height="150" rx="14" fill="#1c1c1c" stroke="#32BFDA" stroke-width="2"/>
  <rect x="100" y="622" width="164" height="70" rx="8" fill="#A5DCE8" opacity=".3"/><text x="100" y="722" font-size="16" fill="#f2f2f2">Mouse</text>
  <!-- sidebar promos and footer -->
  <rect x="84" y="780" width="300" height="12" rx="6" fill="#262626"/><rect x="84" y="806" width="240" height="12" rx="6" fill="#262626"/>
  <rect x="420" y="740" width="296" height="80" rx="12" fill="#1d1d1d" stroke="#333" stroke-dasharray="6 6" stroke-width="2"/>
  <text x="568" y="786" font-size="15" fill="#5c5c5c" text-anchor="middle">SPONSORED</text>
  <!-- cookie bar -->
  <rect x="56" y="852" width="688" height="94" fill="#202020"/>
  <path d="M56 852h688" stroke="#333" stroke-width="2"/>
  <text x="84" y="896" font-size="16" fill="#a0a0a0">We use cookies to improve your experience.</text>
  <rect x="84" y="910" width="120" height="10" rx="5" fill="#333"/>
  <rect x="604" y="878" width="112" height="40" rx="20" fill="#3a3a3a"/><text x="660" y="904" font-size="15" fill="#d6d6d6" text-anchor="middle">Accept</text>
</svg>
