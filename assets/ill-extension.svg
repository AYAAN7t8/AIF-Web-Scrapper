<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 850" font-family="Switzer, 'Segoe UI', Inter, Arial, sans-serif">
  <title>The Sieve extension reading a page you are logged in to</title>
  <rect width="1000" height="850" fill="#0b0b0b"/>
  <!-- browser window -->
  <rect x="56" y="80" width="760" height="640" rx="22" fill="#151515" stroke="#262626" stroke-width="2"/>
  <path d="M56 140h760" stroke="#262626" stroke-width="2"/>
  <circle cx="90" cy="110" r="8" fill="#FF5E57"/><circle cx="116" cy="110" r="8" fill="#FCC55F"/><circle cx="142" cy="110" r="8" fill="#32BFDA"/>
  <rect x="176" y="94" width="480" height="32" rx="16" fill="#0b0b0b"/>
  <path d="M196 106v-3a6 6 0 0 1 12 0v3" fill="none" stroke="#78D3E6" stroke-width="2.2"/><rect x="193" y="105" width="18" height="13" rx="3" fill="#78D3E6"/>
  <text x="222" y="116" font-size="16" fill="#bdbdbd">app.yourstore.com/orders</text>
  <!-- extension icon, pressed -->
  <circle cx="700" cy="110" r="22" fill="none" stroke="#32BFDA" stroke-width="2" opacity=".55"/>
  <rect x="686" y="96" width="28" height="28" rx="7" fill="#32BFDA"/>
  <path d="M692.6 103.4h14.8l-5.6 6.5v5.2l-3.6 1.8v-7z" fill="none" stroke="#0a0a0a" stroke-width="2" stroke-linejoin="round"/>
  <!-- signed-in avatar -->
  <circle cx="770" cy="110" r="15" fill="#FCC55F"/><text x="770" y="116" font-size="15" font-weight="600" fill="#0a0a0a" text-anchor="middle">A</text>
  <!-- sidebar -->
  <rect x="80" y="166" width="150" height="16" rx="8" fill="#2a2a2a"/>
  <rect x="80" y="204" width="120" height="12" rx="6" fill="#222"/><rect x="80" y="234" width="132" height="12" rx="6" fill="#32BFDA" opacity=".5"/>
  <rect x="80" y="264" width="100" height="12" rx="6" fill="#222"/><rect x="80" y="294" width="124" height="12" rx="6" fill="#222"/>
  <!-- page title -->
  <text x="262" y="186" font-size="24" font-weight="600" fill="#f2f2f2">Your orders</text>
  <text x="262" y="214" font-size="15" fill="#8a8a8a">Only visible after you sign in</text>
  <!-- the table Sieve found -->
  <rect x="250" y="240" width="540" height="430" rx="14" fill="none" stroke="#32BFDA" stroke-width="2.5" stroke-dasharray="10 8"/>
  <rect x="250" y="226" width="162" height="28" rx="14" fill="#32BFDA"/>
  <text x="331" y="245" font-size="14" font-weight="600" fill="#0a0a0a" text-anchor="middle">Table found · 48 rows</text>
  <g font-size="15">
    <rect x="266" y="270" width="508" height="40" rx="8" fill="#1f1f1f"/>
    <text x="284" y="296" fill="#8a8a8a">Order</text><text x="400" y="296" fill="#8a8a8a">Item</text><text x="600" y="296" fill="#8a8a8a">Status</text><text x="756" y="296" fill="#8a8a8a" text-anchor="end">Total</text>
    <g fill="#e6e6e6">
      <text x="284" y="350">#3021</text><text x="400" y="350">Desk lamp</text><text x="756" y="350" text-anchor="end">$39.00</text>
      <text x="284" y="410">#3020</text><text x="400" y="410">Monitor riser</text><text x="756" y="410" text-anchor="end">$54.50</text>
      <text x="284" y="470">#3019</text><text x="400" y="470">Cable tray</text><text x="756" y="470" text-anchor="end">$18.90</text>
      <text x="284" y="530">#3018</text><text x="400" y="530">Ergonomic mouse</text><text x="756" y="530" text-anchor="end">$47.00</text>
      <text x="284" y="590">#3017</text><text x="400" y="590">Notebook set</text><text x="756" y="590" text-anchor="end">$12.40</text>
    </g>
    <rect x="600" y="334" width="76" height="24" rx="12" fill="#32BFDA" opacity=".2"/><text x="638" y="351" font-size="13" fill="#78D3E6" text-anchor="middle">Shipped</text>
    <rect x="600" y="394" width="76" height="24" rx="12" fill="#FCC55F" opacity=".2"/><text x="638" y="411" font-size="13" fill="#FCC55F" text-anchor="middle">Packing</text>
    <rect x="600" y="454" width="76" height="24" rx="12" fill="#32BFDA" opacity=".2"/><text x="638" y="471" font-size="13" fill="#78D3E6" text-anchor="middle">Shipped</text>
    <rect x="600" y="514" width="76" height="24" rx="12" fill="#FF5E57" opacity=".2"/><text x="638" y="531" font-size="13" fill="#FF5E57" text-anchor="middle">Returned</text>
    <rect x="600" y="574" width="76" height="24" rx="12" fill="#32BFDA" opacity=".2"/><text x="638" y="591" font-size="13" fill="#78D3E6" text-anchor="middle">Shipped</text>
    <path d="M266 372h508M266 432h508M266 492h508M266 552h508M266 612h508" stroke="#232323" stroke-width="1.5"/>
    <rect x="266" y="628" width="200" height="12" rx="6" fill="#222"/>
  </g>
  <!-- extension popup with the preview -->
  <g>
    <rect x="566" y="150" width="390" height="610" rx="20" fill="#000" opacity=".5" transform="translate(8 12)"/>
    <rect x="566" y="150" width="390" height="610" rx="20" fill="#f6f6f6"/>
    <rect x="592" y="176" width="34" height="34" rx="9" fill="#32BFDA"/>
    <path d="M600 185h18l-6.8 7.9v6.3l-4.4 2.2v-8.5z" fill="none" stroke="#0a0a0a" stroke-width="2.2" stroke-linejoin="round"/>
    <text x="638" y="200" font-size="20" font-weight="600" fill="#0a0a0a">Sieve</text>
    <text x="930" y="200" font-size="14" fill="#6b6b6b" text-anchor="end">this tab</text>
    <text x="592" y="254" font-size="30" font-weight="600" fill="#0a0a0a" letter-spacing="-1">48 rows</text>
    <text x="592" y="280" font-size="15" fill="#6b6b6b">4 columns · scrolled 3 times</text>
    <g font-size="14">
      <rect x="592" y="302" width="338" height="34" rx="8" fill="#e6e6e6"/>
      <text x="606" y="324" fill="#555">Order</text><text x="676" y="324" fill="#555">Item</text><text x="916" y="324" fill="#555" text-anchor="end">Total</text>
      <g fill="#1a1a1a">
        <text x="606" y="364">#3021</text><text x="676" y="364">Desk lamp</text><text x="916" y="364" text-anchor="end">39.00</text>
        <text x="606" y="400">#3020</text><text x="676" y="400">Monitor riser</text><text x="916" y="400" text-anchor="end">54.50</text>
        <text x="606" y="436">#3019</text><text x="676" y="436">Cable tray</text><text x="916" y="436" text-anchor="end">18.90</text>
        <text x="606" y="472">#3018</text><text x="676" y="472">Ergonomic mouse</text><text x="916" y="472" text-anchor="end">47.00</text>
      </g>
      <path d="M592 378h338M592 414h338M592 450h338M592 486h338" stroke="#e3e3e3" stroke-width="1.5"/>
      <text x="592" y="516" fill="#8a8a8a">+ 44 more rows</text>
    </g>
    <rect x="592" y="548" width="338" height="56" rx="28" fill="#0a0a0a"/>
    <text x="761" y="582" font-size="17" font-weight="600" fill="#fff" text-anchor="middle">Click to view more</text>
    <path d="M884 576h16m-6-6 6 6-6 6" fill="none" stroke="#32BFDA" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="592" y="620" width="162" height="48" rx="24" fill="none" stroke="#cfcfcf" stroke-width="2"/>
    <text x="673" y="650" font-size="16" font-weight="600" fill="#0a0a0a" text-anchor="middle">CSV</text>
    <rect x="768" y="620" width="162" height="48" rx="24" fill="none" stroke="#FF5E57" stroke-width="2"/>
    <text x="849" y="650" font-size="16" font-weight="600" fill="#d8443e" text-anchor="middle">Stop scrolling</text>
    <text x="592" y="718" font-size="14" fill="#6b6b6b">Runs in your browser, with your login.</text>
  </g>
</svg>
