<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in — Sieve</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <script src="js/theme-init.js"></script>
  <link rel="preconnect" href="https://api.fontshare.com">
  <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
  <link href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/theme.css">
</head>
<body data-page="login">
  <div id="site-nav"></div>
  <main class="auth-wrap">
    <div class="card auth-card">
      <h1>Welcome back</h1>
      <p class="muted text-sm">Log in to sync recipes across devices.</p>
      <form id="auth-form" novalidate>
        <div class="field"><label for="email">Email</label><input class="input" id="email" type="email" autocomplete="email" placeholder="you@company.com" required><div class="field-error" id="email-err"></div></div>
        <div class="field"><label for="pw">Password</label><input class="input" id="pw" type="password" autocomplete="current-password" placeholder="••••••••" required><div class="field-error" id="pw-err"></div></div>
        <button class="btn btn-primary btn-block" type="submit">Log in</button>
      </form>
      <div class="auth-divider">or</div>
      <a class="btn btn-block" href="app.html">Continue without an account</a>
      <p class="text-sm muted center">New here? <a class="link-btn" href="signup.html">Create an account</a></p>
    </div>
  </main>
  <script src="js/main.js"></script>
  <script>
    Sieve.ready(function () {
      document.getElementById('auth-form').addEventListener('submit', function (e) {
        e.preventDefault();
        var em = document.getElementById('email'), pw = document.getElementById('pw'), ok = true;
        em.classList.remove('is-invalid'); pw.classList.remove('is-invalid');
        document.getElementById('email-err').textContent = ''; document.getElementById('pw-err').textContent = '';
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em.value)) { em.classList.add('is-invalid'); document.getElementById('email-err').textContent = 'Enter a valid email address.'; ok = false; }
        if (pw.value.length < 8) { pw.classList.add('is-invalid'); document.getElementById('pw-err').textContent = 'Password must be at least 8 characters.'; ok = false; }
        if (!ok) return;
        Sieve.toast('This local build has no account server — nothing was sent or stored. Opening the app…', 'info', 2500);
        setTimeout(function () { location.href = 'app.html'; }, 1400);
      });
    });
  </script>
</body>
</html>
